<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400">
  <title>IronStock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px; min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    .header {
      padding: 16px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .header h1 { font-size: 18px; font-weight: 700; color: #f59e0b; }
    .header .version { font-size: 11px; color: #64748b; }

    /* Login Form */
    .login-form { padding: 20px; }
    .login-form h2 { font-size: 15px; margin-bottom: 16px; color: #94a3b8; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .field input {
      width: 100%; padding: 8px 12px; border-radius: 6px;
      border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
      font-size: 14px; outline: none;
    }
    .field input:focus { border-color: #f59e0b; }
    .btn {
      width: 100%; padding: 10px; border-radius: 6px; border: none;
      background: #f59e0b; color: #0f172a; font-weight: 600;
      font-size: 14px; cursor: pointer; margin-top: 8px;
    }
    .btn:hover { background: #d97706; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #ef4444; font-size: 12px; margin-top: 8px; }

    /* Vault View */
    .vault { padding: 12px; display: none; }
    .search-bar {
      width: 100%; padding: 8px 12px; border-radius: 6px;
      border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
      font-size: 14px; outline: none; margin-bottom: 12px;
    }
    .search-bar:focus { border-color: #f59e0b; }
    .item-list { max-height: 280px; overflow-y: auto; }
    .item {
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      margin-bottom: 4px;
    }
    .item:hover { background: #1e293b; }
    .item-name { font-weight: 500; font-size: 14px; }
    .item-folder { font-size: 11px; color: #64748b; margin-top: 2px; }
    .item-type {
      display: inline-block; font-size: 10px; padding: 2px 6px;
      border-radius: 4px; background: #1e293b; color: #94a3b8; margin-top: 4px;
    }

    /* Footer */
    .footer {
      padding: 12px 16px; border-top: 1px solid #1e293b;
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer .status { font-size: 11px; color: #22c55e; }
    .footer .logout-btn {
      font-size: 12px; color: #94a3b8; background: none; border: none;
      cursor: pointer; text-decoration: underline;
    }
    .footer .logout-btn:hover { color: #ef4444; }

    .empty { text-align: center; color: #64748b; padding: 40px 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>IronStock</h1>
    <span class="version">v0.1.0</span>
  </div>

  <!-- Login -->
  <div id="login-view" class="login-form">
    <h2>Vault'a Bağlan</h2>
    <div class="field">
      <label for="server-url">Sunucu URL</label>
      <input type="url" id="server-url" placeholder="https://ironstock.example.com">
    </div>
    <div class="field">
      <label for="username">Kullanıcı Adı</label>
      <input type="text" id="username" placeholder="admin">
    </div>
    <div class="field">
      <label for="password">Şifre</label>
      <input type="password" id="password">
    </div>
    <div class="field" id="totp-field" style="display:none;">
      <label for="totp">TOTP Kodu</label>
      <input type="text" id="totp" placeholder="123456" maxlength="6">
    </div>
    <button class="btn" id="login-btn">Giriş Yap</button>
    <div class="error" id="login-error"></div>
  </div>

  <!-- Vault -->
  <div id="vault-view" class="vault">
    <input type="search" class="search-bar" id="search" placeholder="Credential ara...">
    <div class="item-list" id="item-list">
      <div class="empty">Arama yapın veya bir klasör seçin</div>
    </div>
  </div>

  <div class="footer" id="footer" style="display:none;">
    <span class="status" id="status">Bağlı</span>
    <button class="logout-btn" id="logout-btn">Çıkış</button>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
