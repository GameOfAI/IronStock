<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>IronStock Ayarları</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 500px; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    h1 { font-size: 20px; color: #f59e0b; margin-bottom: 20px; }
    .section { margin-bottom: 24px; }
    .section h2 { font-size: 14px; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    .field input {
      width: 100%; padding: 8px 12px; border-radius: 6px;
      border: 1px solid #334155; background: #1e293b; color: #e2e8f0;
      font-size: 14px; outline: none;
    }
    .field input:focus { border-color: #f59e0b; }
    .field input:read-only { opacity: 0.6; }
    .btn {
      padding: 8px 16px; border-radius: 6px; border: none;
      background: #f59e0b; color: #0f172a; font-weight: 600;
      font-size: 13px; cursor: pointer;
    }
    .btn:hover { background: #d97706; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .status { font-size: 12px; margin-top: 8px; }
    .status.ok { color: #22c55e; }
    .status.err { color: #ef4444; }
    .info { font-size: 12px; color: #64748b; margin-top: 8px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>IronStock Ayarları</h1>

  <div class="section">
    <h2>Bağlantı</h2>
    <div class="field">
      <label>Sunucu URL</label>
      <input type="url" id="server-url" readonly>
    </div>
    <div id="connection-status" class="status"></div>
  </div>

  <div class="section">
    <h2>Oturum</h2>
    <button class="btn btn-danger" id="logout-btn">Oturumu Sonlandır</button>
    <div class="info">Tüm kayıtlı token'lar silinir ve yeniden giriş yapmanız gerekir.</div>
  </div>

  <div class="section">
    <h2>Hakkında</h2>
    <div class="info">
      IronStock Browser Extension v0.1.0<br>
      Credential vault'tan web formlarına otomatik doldurma.<br>
      <a href="https://github.com/GameOfAI/IronStock" style="color:#f59e0b;">GitHub</a>
    </div>
  </div>

  <script type="module">
    import { getConfig, clearConfig } from '../lib/api-client.js';

    async function init() {
      const config = await getConfig();
      document.getElementById('server-url').value = config.serverUrl || '(yapılandırılmamış)';

      const status = document.getElementById('connection-status');
      if (config.accessToken) {
        status.textContent = 'Bağlı';
        status.className = 'status ok';
      } else {
        status.textContent = 'Bağlı değil';
        status.className = 'status err';
      }
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await clearConfig();
      document.getElementById('connection-status').textContent = 'Oturum sonlandırıldı';
      document.getElementById('connection-status').className = 'status err';
    });

    init();
  </script>
</body>
</html>
