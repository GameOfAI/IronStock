apiVersion: v1
kind: ConfigMap
metadata:
  name: envanter-config
  namespace: envanter
data:
  ENVANTER_ADDR: ":8080"
  ENVANTER_LOG_LEVEL: "info"
  ENVANTER_DB_HOST: "postgres"
  ENVANTER_DB_PORT: "5432"
  ENVANTER_DB_NAME: "envanter"
  ENVANTER_DB_USER: "envanter"
  ENVANTER_DB_SSLMODE: "disable"
  ENVANTER_SMTP_HOST: "mailhog"
  ENVANTER_SMTP_PORT: "1025"
  ENVANTER_SMTP_FROM: "noreply@envanter.local"
  ENVANTER_MINIO_ENDPOINT: "minio:9000"
  ENVANTER_MINIO_BUCKET: "envanter"
  ENVANTER_MINIO_USE_SSL: "false"
