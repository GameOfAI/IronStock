apiVersion: apps/v1
kind: Deployment
metadata:
  name: envanter-web
  namespace: envanter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envanter-web
  template:
    metadata:
      labels:
        app: envanter-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: web
          image: ghcr.io/gameofai/envanter-web:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # nginx master needs NET_BIND_SERVICE to bind port 80 as non-root.
              # Remove once Dockerfile switches to port 8080 + runAsNonRoot.
              add: ["NET_BIND_SERVICE"]
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: envanter-web
  namespace: envanter
spec:
  type: NodePort
  selector:
    app: envanter-web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30830
