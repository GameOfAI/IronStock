# PLACEHOLDER — bu dosya henüz gerçek şifreli veri içermiyor.
#
# Gerçek SealedSecret üretmek için:
#   1. deploy/k8s/secret.yaml dosyasını oluştur (secret.yaml.example'dan kopyala)
#   2. Değerleri doldur (openssl rand -base64 32)
#   3. make seal-secret
#
# Detaylar: docs/ops/sealed-secrets.md
#
# kustomization.yaml'daki secret.sealed.yaml satırını bu dosya hazır olmadan UNCOMMENT ETME.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: envanter-secret
  namespace: envanter
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    # Aşağıdaki değerler `make seal-secret` ile üretilir.
    # Her değer cluster-specific public key ile şifrelenmiş base64 bloğudur.
    ENVANTER_MASTER_KEY: PLACEHOLDER_RUN_MAKE_SEAL_SECRET
    ENVANTER_JWT_SECRET: PLACEHOLDER_RUN_MAKE_SEAL_SECRET
    POSTGRES_PASSWORD: PLACEHOLDER_RUN_MAKE_SEAL_SECRET
    ENVANTER_DB_URL: PLACEHOLDER_RUN_MAKE_SEAL_SECRET
  template:
    metadata:
      name: envanter-secret
      namespace: envanter
    type: Opaque
