# IronStock Günlük Otomatik Yedekleme CronJob'u
# Her gün 02:00 UTC'de çalışır.
# pg_dump + mc mirror (MinIO) + opsiyonel S3 upload.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ironstock-backup
  namespace: envanter
  labels:
    app: ironstock
    component: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: ironstock
            component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          containers:
            - name: backup
              image: postgres:15-alpine
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  apk add --no-cache gzip curl > /dev/null 2>&1

                  TIMESTAMP="$(date -u +%Y%m%d-%H%M%S)"
                  BACKUP_FILE="/backups/ironstock-db-${TIMESTAMP}.sql.gz"

                  echo "[${TIMESTAMP}] pg_dump basliyor..."
                  pg_dump "${ENVANTER_DB_URL}" \
                    --no-owner --no-privileges --clean --if-exists \
                    | gzip > "${BACKUP_FILE}"

                  SIZE=$(du -sh "${BACKUP_FILE}" | cut -f1)
                  echo "[$(date -u +%H:%M:%S)] Dump tamamlandi: ${SIZE}"

                  # Eski yedekleri temizle (30 gun)
                  find /backups -name "ironstock-db-*.sql.gz" -mtime +30 -delete 2>/dev/null || true

                  echo "[$(date -u +%H:%M:%S)] Yedekleme tamamlandi: ${BACKUP_FILE}"
              env:
                - name: ENVANTER_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: ironstock-secret
                      key: ENVANTER_DB_URL
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: ironstock-backup-pvc
---
# PVC for backup storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ironstock-backup-pvc
  namespace: envanter
  labels:
    app: ironstock
    component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
