apiVersion: apps/v1
kind: Deployment
metadata:
  name: envanter-api
  namespace: envanter
spec:
  replicas: 3  # PR-SCALE: multi-replica; requires ENVANTER_REDIS_URL in secret
  selector:
    matchLabels:
      app: envanter-api
  template:
    metadata:
      labels:
        app: envanter-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      initContainers:
        - name: migrate
          image: ghcr.io/gameofai/envanter-api:latest
          command: ["/goose", "-dir", "/migrations", "postgres", "$(ENVANTER_DB_URL)", "up"]
          envFrom:
            - secretRef:
                name: envanter-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/gameofai/envanter-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: envanter-config
            - secretRef:
                name: envanter-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: envanter-api
  namespace: envanter
spec:
  selector:
    app: envanter-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: envanter-api-pdb
  namespace: envanter
spec:
  minAvailable: 1  # PR-SCALE: keep at least 1 pod during rolling updates
  selector:
    matchLabels:
      app: envanter-api
