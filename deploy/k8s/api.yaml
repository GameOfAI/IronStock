apiVersion: apps/v1
kind: Deployment
metadata:
  name: envanter-api
  namespace: envanter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envanter-api
  template:
    metadata:
      labels:
        app: envanter-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ghcr.io/bhaslaman/envanter-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: envanter-config
            - secretRef:
                name: envanter-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: envanter-api
  namespace: envanter
spec:
  selector:
    app: envanter-api
  ports:
    - port: 8080
      targetPort: 8080
