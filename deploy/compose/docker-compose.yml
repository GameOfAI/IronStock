# Envanter App — Geliştirici dev stack.
# Sadece lokal development için. Üretim için deploy/helm/ kullanılır.
#
# Kullanım:
#   make up     # başlat
#   make ps     # durum
#   make logs   # log'ları izle
#   make down   # kapat

name: envanter-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: envanter
      POSTGRES_PASSWORD: envanter_dev
      POSTGRES_DB: envanter
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envanter -d envanter"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_dev
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ENVANTER_ADDR: ":8080"
      ENVANTER_LOG_LEVEL: "debug"
      ENVANTER_DB_URL: "postgres://envanter:envanter_dev@postgres:5432/envanter?sslmode=disable"
      ENVANTER_MASTER_KEY: "Vb0/UxR3MObGNxhzEZ2xLX35nDSkiwAoPek5GBdm40I="
      ENVANTER_JWT_SECRET: "EKuurRf6tOmDStGskLqnwZBL9s3e7NkcMcAP9fHQ1+s="
      ENVANTER_SMTP_HOST: "mailhog"
      ENVANTER_SMTP_PORT: "1025"
      ENVANTER_MINIO_ENDPOINT: "minio:9000"
      ENVANTER_MINIO_BUCKET: "envanter-dev"
      ENVANTER_MINIO_ACCESS_KEY: "minioadmin"
      ENVANTER_MINIO_SECRET_KEY: "minioadmin_dev"
      ENVANTER_MINIO_SECURE: "false"
      ENVANTER_BOOTSTRAP_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8080"
      VITE_PROXY_TARGET: "http://server:8080"
      VITE_WS_PROXY_TARGET: "ws://server:8080"
    depends_on:
      - server

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
