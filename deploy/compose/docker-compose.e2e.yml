# IronStock — E2E test stack (PR-PROD3).
#
# Extends the dev docker-compose with E2E-specific overrides:
#  - Uses ghcr.io/ironstock images (built by CI) instead of local builds.
#  - Ephemeral volumes (no data persistence between runs).
#  - Exposes fixed ports for Playwright.
#  - Disables TOTP and mTLS enforcement (set via env vars).
#
# Usage:
#   make e2e-up    # start the E2E stack
#   make e2e-down  # tear down + remove volumes
#
# Environment variables:
#   IRONSTOCK_IMAGE_TAG  - defaults to "latest"
#
# Playwright configuration:
#   BASE_URL=http://localhost:5173
#   API_URL=http://localhost:8080

name: ironstock-e2e

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ironstock
      POSTGRES_PASSWORD: e2e_test_pass
      POSTGRES_DB: ironstock_e2e
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"   # 5433 to avoid conflict with dev stack
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral; wipe on restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ironstock -d ironstock_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # 6380 to avoid conflict with dev stack
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO (attachments) ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9100:9000"
      - "9101:9001"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Mailhog (email testing) ───────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1026:1025"   # SMTP
      - "8026:8025"   # Web UI

  # ── IronStock API ─────────────────────────────────────────────────────────
  api:
    image: ghcr.io/ironstock/envanter-api:${IRONSTOCK_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Database
      ENVANTER_DATABASE_URL: "postgresql://ironstock:e2e_test_pass@postgres:5432/ironstock_e2e"
      # JWT
      ENVANTER_JWT_SECRET: "e2e-test-jwt-secret-do-not-use-in-prod-32b"
      # Master key (ephemeral test key)
      ENVANTER_MASTER_KEY: "e2e-test-master-key-32-bytes-long!"
      # Redis
      ENVANTER_REDIS_URL: "redis://redis:6379"
      ENVANTER_RATE_LIMIT_BACKEND: "redis"
      # MinIO
      ENVANTER_MINIO_ENDPOINT: "minio:9000"
      ENVANTER_MINIO_ACCESS_KEY: "minioadmin"
      ENVANTER_MINIO_SECRET_KEY: "minioadmin123"
      ENVANTER_MINIO_BUCKET: "ironstock-e2e"
      ENVANTER_MINIO_USE_SSL: "false"
      # Email
      ENVANTER_SMTP_HOST: "mailhog"
      ENVANTER_SMTP_PORT: "1025"
      ENVANTER_SMTP_FROM: "e2e@ironstock.test"
      ENVANTER_SMTP_TLS: "none"
      # E2E: disable real GeoIP checks (use always-pass mode)
      ENVANTER_GEOIP_DISABLE: "true"
      # Logging
      ENVANTER_LOG_LEVEL: "info"
      ENVANTER_LOG_FORMAT: "json"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ── IronStock Web UI ──────────────────────────────────────────────────────
  web:
    image: ghcr.io/ironstock/envanter-web:${IRONSTOCK_IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"   # Playwright expects http://localhost:5173
    environment:
      # The web image uses nginx; API_URL is injected at runtime via
      # nginx proxy_pass to the API container.
      VITE_API_BASE_URL: "http://api:8080"
