[package]
name = "envanter-client"
version = "0.1.0"
description = "Envanter desktop client"
authors = ["Envanter App Contributors"]
edition = "2021"
rust-version = "1.75"

# Tauri 2 için library + binary kurulumu (mobile target hazırlığı)
[lib]
name = "envanter_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "2"
tokio = { version = "1", features = ["time"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
