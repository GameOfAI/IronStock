# Pre-commit hook config (https://pre-commit.com/)
#
# Kurulum:
#   pip install pre-commit
#   pre-commit install
#
# Manuel çalıştırma:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
        exclude: ^scripts/seed-mock-data\.mjs$
      - id: mixed-line-ending
        args: [--fix=lf]

  # Go
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'cd server && diff=$(gofmt -l .) && [ -z "$diff" ] || (echo "$diff"; exit 1)'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'cd server && go mod tidy && c=$(git status --porcelain -- go.mod go.sum); if [ -n "$c" ]; then echo "go.mod/go.sum not tidy:"; echo "$c"; exit 1; fi'
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        # golangci-lint (with goimports formatter) may add checksums to go.work.sum
        # in the workspace root when resolving transitive deps during analysis.
        # Those additions are benign — restore go.work.sum to avoid a spurious
        # "files were modified by this hook" failure.
        entry: bash -c 'cd server && golangci-lint run ./...; rc=$?; git restore ../go.work.sum 2>/dev/null || true; exit $rc'
        language: system
        types: [go]
        pass_filenames: false

  # TypeScript / ESLint (web)
  - repo: local
    hooks:
      # npm workspaces: eslint binary is hoisted to the repo-root node_modules,
      # so a fixed web/node_modules/.bin path doesn't exist. Run the same
      # `npm run lint` the CI Web job uses (eslint . --max-warnings 0).
      - id: eslint-web
        name: ESLint (web)
        language: system
        entry: bash -c 'cd web && npm run lint'
        files: web/src/.*\.(ts|tsx)$
        pass_filenames: false

  # Tracking dosyaları kontrolü (PROGRESS.md + TODO.md zorunluluğu)
  # Kural: her kod commit'inde tracking dosyaları da güncellenmeli (ADR-0012)
  - repo: local
    hooks:
      - id: check-tracking-files
        name: Tracking dosyaları kontrolü (PROGRESS.md + TODO.md)
        entry: bash scripts/check-tracking-files.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
