# Pre-commit hook config (https://pre-commit.com/)
#
# Kurulum:
#   pip install pre-commit
#   pre-commit install
#
# Manuel çalıştırma:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Go
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'cd server && diff=$(gofmt -l .) && [ -z "$diff" ] || (echo "$diff"; exit 1)'
        language: system
        types: [go]
        pass_filenames: false

      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'cd server && go mod tidy && c=$(git status --porcelain -- go.mod go.sum); if [ -n "$c" ]; then echo "go.mod/go.sum not tidy:"; echo "$c"; exit 1; fi'
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd server && golangci-lint run ./...'
        language: system
        types: [go]
        pass_filenames: false

  # TypeScript / ESLint (web)
  - repo: local
    hooks:
      - id: eslint-web
        name: ESLint (web)
        language: node
        entry: web/node_modules/.bin/eslint
        types: [file]
        files: web/src/.*\.(ts|tsx)$
        args: ['--max-warnings=0']
        pass_filenames: true

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
