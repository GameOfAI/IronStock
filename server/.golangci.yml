version: "2"
run:
  go: "1.22"
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
    misspell:
      locale: US
    revive:
      severity: warning
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: unused-parameter
        - name: unused-receiver
        - name: early-return
  exclusions:
    generated: lax
    # Standard golangci-lint exclusion presets. Adopted during the v1→v2
    # migration (golangci-lint v2 ships much newer staticcheck/revive/gosec
    # whose new rules surfaced pre-existing style/std-lib noise the team never
    # enforced). These presets restore the conventional baseline:
    #   comments              → skip "missing/!malformed doc comment" nags
    #   std-error-handling    → skip unchecked errors on Close/Write/Print etc.
    #   common-false-positives→ skip well-known gosec/staticcheck FPs
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      - linters:
          - errcheck
          - unparam
          - noctx
        path: _test\.go
      - linters:
          - revive
        path: cmd/
        text: exported
      # Outbound integration dialers (syslog/SMTP/TLS). Threading a context
      # through these transports is a separate refactor; excluded for now.
      - linters:
          - noctx
        path: internal/(logfwd|email)/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
