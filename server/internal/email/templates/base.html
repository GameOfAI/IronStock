<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Subject}}</title>
<style>
  body { margin: 0; padding: 0; background: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .wrapper { max-width: 600px; margin: 32px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .header { background: #18181b; padding: 24px 32px; }
  .header-logo { color: #ffffff; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; text-decoration: none; }
  .header-logo span { color: #6366f1; }
  .body { padding: 32px; color: #27272a; }
  .body h1 { margin: 0 0 16px; font-size: 22px; font-weight: 700; color: #18181b; }
  .body p { margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #52525b; }
  .btn { display: inline-block; padding: 12px 24px; background: #6366f1; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 15px; margin: 8px 0 16px; }
  .btn-danger { background: #dc2626; }
  .alert-amber { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 6px; padding: 14px 18px; margin: 16px 0; font-size: 14px; color: #78350f; }
  .alert-red { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 6px; padding: 14px 18px; margin: 16px 0; font-size: 14px; color: #7f1d1d; }
  .code-box { background: #f4f4f5; border-radius: 6px; padding: 14px 18px; margin: 16px 0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 18px; letter-spacing: 3px; text-align: center; color: #18181b; font-weight: 700; }
  .footer { background: #fafafa; border-top: 1px solid #e4e4e7; padding: 20px 32px; text-align: center; font-size: 12px; color: #a1a1aa; }
  .footer a { color: #71717a; text-decoration: none; }
  .divider { border: none; border-top: 1px solid #e4e4e7; margin: 24px 0; }
  .meta-row { display: flex; gap: 8px; font-size: 13px; color: #71717a; margin-bottom: 8px; }
  .meta-label { font-weight: 600; color: #52525b; min-width: 80px; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <a class="header-logo" href="{{.AppURL}}">Iron<span>Stock</span></a>
  </div>
  <div class="body">
    {{template "content" .}}
  </div>
  <div class="footer">
    &copy; IronStock &middot; <a href="{{.AppURL}}">{{.AppURL}}</a><br>
    Bu e-postayı siz talep etmediyseniz güvenle görmezden gelebilirsiniz.
  </div>
</div>
</body>
</html>
