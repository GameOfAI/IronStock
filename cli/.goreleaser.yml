# .goreleaser.yml — ironstock CLI multi-arch release configuration.
#
# Usage:
#   goreleaser release --clean          # full release (needs GITHUB_TOKEN)
#   goreleaser build --snapshot --clean # local snapshot build
#
# Produces binaries for:
#   linux/amd64, linux/arm64
#   darwin/amd64 (Intel Mac), darwin/arm64 (Apple Silicon)
#   windows/amd64

version: 2

project_name: ironstock

before:
  hooks:
    - go mod tidy

builds:
  - id: ironstock
    main: .
    binary: ironstock
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X ironstock.app/cli/cmd.Version={{.Version}}
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    name_template: "ironstock_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - ../docs/integrations/cli.md

checksum:
  name_template: "ironstock_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  github:
    owner: your-org
    name: IronStock
  draft: true
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
