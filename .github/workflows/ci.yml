name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Aynı PR'a peş peşe push'ta eski run'ı iptal et.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ---------------- Server (Go) ----------------
  server:
    name: Server (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.22"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: server/go.sum

      - name: Verify gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt issues:"
            echo "$out"
            exit 1
          fi

      - name: Verify go mod tidy
        run: |
          go mod tidy
          changed=$(git status --porcelain -- go.mod go.sum)
          if [ -n "$changed" ]; then
            echo "go.mod/go.sum not tidy. Run 'go mod tidy' locally and commit."
            echo "$changed"
            git --no-pager diff -- go.mod go.sum 2>/dev/null || true
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.55.2
          working-directory: server
          args: --timeout=5m

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-${{ matrix.os }}
          path: server/coverage.out
          if-no-files-found: ignore

  # ---------------- Docker Build & Push (GHCR) ----------------
  # Dockerfile uses --platform=$BUILDPLATFORM (native cross-compile, no QEMU).
  # Both main push and v* tag push build linux/amd64,linux/arm64 (~8dk total).
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [server]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine platforms
        id: platforms
        run: |
          echo "list=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT

      - name: Determine tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "api=ghcr.io/${{ github.repository_owner }}/envanter-api:${VERSION},ghcr.io/${{ github.repository_owner }}/envanter-api:latest" >> $GITHUB_OUTPUT
            echo "web=ghcr.io/${{ github.repository_owner }}/envanter-web:${VERSION},ghcr.io/${{ github.repository_owner }}/envanter-web:latest" >> $GITHUB_OUTPUT
          else
            SHA="${GITHUB_SHA::7}"
            echo "api=ghcr.io/${{ github.repository_owner }}/envanter-api:main-${SHA},ghcr.io/${{ github.repository_owner }}/envanter-api:latest" >> $GITHUB_OUTPUT
            echo "web=ghcr.io/${{ github.repository_owner }}/envanter-web:main-${SHA},ghcr.io/${{ github.repository_owner }}/envanter-web:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          platforms: ${{ steps.platforms.outputs.list }}
          tags: ${{ steps.tags.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          platforms: ${{ steps.platforms.outputs.list }}
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------- Pre-commit (multi-language hygiene) ----------------
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v1.55.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v1.55.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure
