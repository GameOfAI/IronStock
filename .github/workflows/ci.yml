name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı PR'a peş peşe push'ta eski run'ı iptal et.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------- Server (Go) ----------------
  server:
    name: Server (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.22"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: server/go.sum

      - name: Verify gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt issues:"
            echo "$out"
            exit 1
          fi

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum not tidy"; exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.55.2
          working-directory: server
          args: --timeout=5m

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-${{ matrix.os }}
          path: server/coverage.out
          if-no-files-found: ignore

  # ---------------- Pre-commit (multi-language hygiene) ----------------
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          # Go hook'ları local system entry kullanıyor; ilk run'da tool'ları kurmamız gerek
          extra_args: --all-files --show-diff-on-failure
