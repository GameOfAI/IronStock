name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Aynı PR'a peş peşe push'ta eski run'ı iptal et.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

# Job-level permission overrides are used where elevated access is needed
# (e.g. docker job writes back image tags to kustomization.yaml).

jobs:
  # ---------------- Tracking dosyaları kontrolü ----------------
  tracking-check:
    name: Tracking Files (PROGRESS.md + TODO.md)
    runs-on: ubuntu-latest
    # Sadece pull_request'te çalışır — direkt main push'ta uygulanamaz (hook zaten yerel yakaladı)
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Tam geçmiş — base branch karşılaştırması için

      - name: Kod dosyası değişikliği var mı?
        id: code-changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"
          echo "$changed"

          code_changed=false
          while IFS= read -r f; do
            case "$f" in
              server/*|web/src/*|client/src/*|client/src-tauri/*|cli/*|e2e/tests/*|deploy/k8s/*|deploy/compose/*|.github/workflows/*)
                code_changed=true
                break
                ;;
            esac
          done <<< "$changed"

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      - name: PROGRESS.md ve TODO.md güncellendi mi?
        if: steps.code-changed.outputs.code_changed == 'true'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base" "$head")

          missing=()
          echo "$changed" | grep -qx "PROGRESS.md" || missing+=("PROGRESS.md")
          echo "$changed" | grep -qx "TODO.md"     || missing+=("TODO.md")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Tracking kuralı ihlali: Kod değişikliği var ama şu dosyalar PR'da güncellenmemiş: ${missing[*]}"
            echo ""
            echo "Kural (RULES.md + ADR-0012):"
            echo "Her PR, PROGRESS.md ve TODO.md güncellemelerini içermelidir."
            exit 1
          fi
          echo "✅ PROGRESS.md ve TODO.md güncellendi."

  # ---------------- Server (Go) ----------------
  server:
    name: Server (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Go 1.25 — go.work/go.mod `go 1.25.0` gerektiriyor (go-webauthn v0.17.4
        # transitively go >= 1.25 ister). golangci-lint v2.x bu modülü typecheck
        # edebiliyor; v1.62.2 edemiyordu (bu PR'da v1→v2 migrate edildi).
        go: ["1.25"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: server/go.sum

      - name: Verify gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt issues:"
            echo "$out"
            exit 1
          fi

      - name: Verify go mod tidy
        run: |
          go mod tidy
          changed=$(git status --porcelain -- go.mod go.sum)
          if [ -n "$changed" ]; then
            echo "go.mod/go.sum not tidy. Run 'go mod tidy' locally and commit."
            echo "$changed"
            git --no-pager diff -- go.mod go.sum 2>/dev/null || true
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: server

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-coverage-${{ matrix.os }}
          path: server/coverage.out
          if-no-files-found: ignore

  # ---------------- Web (Vite + React + TS) ----------------
  # Faz 3 PR-W1+: type-check, lint, test (Vitest + RTL), production build.
  # Web tarafı build hatası serverdan bağımsız fail olmalı (server runs even
  # if web breaks).
  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        # Run from repo root so npm workspace install resolves all packages
        # (shared/pkg, web, client) and fetches the correct platform binary
        # for lightningcss (linux-x64-gnu in CI, darwin-arm64 locally).
        working-directory: '.'
        run: npm install --no-audit --no-fund

      - name: Type check
        # `tsc -b` for composite project references (tsconfig.app.json +
        # tsconfig.node.json). The --noEmit flag is incompatible with
        # build mode + composite refs (TS6310); .tsbuildinfo writes go
        # to node_modules/.tmp which is gitignored.
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------- Client (Tauri frontend — Vite + React + TS) ----------------
  # Rust/Tauri binary derlenmez (platform native tool gerektirir, ~10dk).
  # Sadece TS/React katmanı: tsc + lint + test + vite build.
  # Tauri binary CI'ı PR-C6 (client-win-packaging) ile eklenecek.
  client:
    name: Client (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: '.'
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (Vite only, no Tauri binary)
        run: npm run build

  # ---------------- Server Integration (testcontainers + Postgres) ----------------
  # Build tag 'integration' ile yazılan testler. testcontainers-go gerçek Postgres
  # container'ı başlatır → migration up/down/up + seed validation. Docker GitHub
  # runner'da hazır (ubuntu-latest).
  server-integration:
    name: Server Integration (Postgres)
    runs-on: ubuntu-latest
    needs: [server]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: server/go.sum
      - name: Run integration tests
        run: go test -tags=integration -timeout=10m -v ./internal/db/...

  # ---------------- Docker Build & Push (GHCR) ----------------
  # Dockerfile uses --platform=$BUILDPLATFORM (native cross-compile, no QEMU).
  # Both main push and v* tag push build linux/amd64,linux/arm64 (~8dk total).
  # After a main push, the job commits updated image tags back to
  # deploy/k8s/kustomization.yaml so ArgoCD picks up the exact SHA.
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [server]
    permissions:
      contents: write
      packages: write
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          # Full clone so we can push back the kustomization tag update.
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine platforms
        id: platforms
        run: |
          echo "list=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT

      - name: Determine tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "api=ghcr.io/${OWNER}/envanter-api:${VERSION},ghcr.io/${OWNER}/envanter-api:latest" >> $GITHUB_OUTPUT
            echo "web=ghcr.io/${OWNER}/envanter-web:${VERSION},ghcr.io/${OWNER}/envanter-web:latest" >> $GITHUB_OUTPUT
          else
            SHA="${GITHUB_SHA::7}"
            echo "api=ghcr.io/${OWNER}/envanter-api:main-${SHA},ghcr.io/${OWNER}/envanter-api:latest" >> $GITHUB_OUTPUT
            echo "web=ghcr.io/${OWNER}/envanter-web:main-${SHA},ghcr.io/${OWNER}/envanter-web:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          platforms: ${{ steps.platforms.outputs.list }}
          tags: ${{ steps.tags.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          platforms: ${{ steps.platforms.outputs.list }}
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Commit updated image tags to kustomization.yaml so ArgoCD
      # deploys the exact SHA instead of relying on :latest pull.
      # Runs only on main push (not tags — version tags are applied separately).
      # [skip ci] prevents triggering another workflow run.
      - name: Update k8s image tags in kustomization.yaml
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="main-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cd deploy/k8s
          kustomize edit set image \
            "ghcr.io/${OWNER}/envanter-api:${TAG}" \
            "ghcr.io/${OWNER}/envanter-web:${TAG}"
          cd ../..
          git add deploy/k8s/kustomization.yaml
          git diff --staged --quiet && exit 0
          git commit -m "chore(deploy): bump api+web images to ${TAG} [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main

  # ---------------- Client (Tauri binary — Windows x64) ----------------
  # Rust + MSVC hedef derleme + NSIS installer üretimi.
  # Rust cache (swatinem/rust-cache) ile ilk ~15dk → sonraki ~5dk.
  # Artifact: main push ve v* tag'lerde 30 gün saklanır; PR'larda sadece build validate.
  client-tauri-win:
    name: Client (Tauri / Win x64)
    runs-on: windows-latest
    needs: [client]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Build Tauri app (Windows x64)
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target x86_64-pc-windows-msvc

      - name: Upload installer artifact
        if: |
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v7
        with:
          name: ironstock-win-x64-${{ github.sha }}
          path: |
            client/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            client/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: warn

  # ---------------- Client (Tauri binary — macOS arm64 + x86_64) ----------------
  # Universal DMG for Mac (arm64 + x86_64 via lipo).
  # TAURI_SIGNING_PRIVATE_KEY + TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be set
  # as repo secrets for auto-updater signature. Generate with:
  #   npx tauri signer generate -w ~/.tauri/ironstock.key
  # then store the contents of ironstock.key as TAURI_SIGNING_PRIVATE_KEY.
  client-tauri-mac:
    name: Client (Tauri / macOS Universal)
    runs-on: macos-latest
    needs: [client]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Build Tauri app (macOS Universal)
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target universal-apple-darwin

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: ironstock-mac-universal-${{ github.sha }}
          path: |
            client/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: warn

  # ---------------- GitHub Release (v* tags only) ----------------
  # Creates a GitHub Release with Win .msi and Mac .dmg artifacts.
  # Runs after both Tauri build jobs succeed on a version tag.
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [client-tauri-win, client-tauri-mac]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ironstock-win-x64-${{ github.sha }}
          path: dist/win

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ironstock-mac-universal-${{ github.sha }}
          path: dist/mac

      - name: List artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: IronStock ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/win/**/*.msi
            dist/win/**/*.exe
            dist/mac/**/*.dmg

  # ---------------- Pre-commit (multi-language hygiene) ----------------
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.12.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # eslint-web hook çağırdığı binary: web/node_modules/.bin/eslint
      # workspace install (root) tüm paketleri (web/client/shared) kurar.
      - name: Install web deps (eslint-web hook için)
        run: npm install --no-audit --no-fund
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure
