name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Aynı PR'a peş peşe push'ta eski run'ı iptal et.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ---------------- Server (Go) ----------------
  server:
    name: Server (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Go 1.23 — pin'lenmiş çünkü:
        # 1. golangci-lint v1.62.2 binary'si Go 1.23 ile derlenmiş; Go 1.26 SDK'sındaki
        #    fips140only_go1.26.go gibi dosyaları typecheck edemiyor (v2.x'e migrate
        #    edilince stable'a dönülebilir).
        # 2. go-version değişimi setup-go cache key'ini invalidate eder, eski stale
        #    modül cache'i (pgx v5.9.2 vs) temizlenir.
        go: ["1.23"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: server/go.sum

      - name: Verify gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "gofmt issues:"
            echo "$out"
            exit 1
          fi

      - name: Verify go mod tidy
        run: |
          go mod tidy
          changed=$(git status --porcelain -- go.mod go.sum)
          if [ -n "$changed" ]; then
            echo "go.mod/go.sum not tidy. Run 'go mod tidy' locally and commit."
            echo "$changed"
            git --no-pager diff -- go.mod go.sum 2>/dev/null || true
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          working-directory: server
          args: --timeout=5m

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage-${{ matrix.os }}
          path: server/coverage.out
          if-no-files-found: ignore

  # ---------------- Web (Vite + React + TS) ----------------
  # Faz 3 PR-W1+: type-check, lint, test (Vitest + RTL), production build.
  # Web tarafı build hatası serverdan bağımsız fail olmalı (server runs even
  # if web breaks).
  web:
    name: Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        # Using `install` (not `ci`) until package-lock.json lands —
        # foundation PR (PR-W1) bootstraps the deps; lock will be
        # committed by the first machine that runs npm install locally.
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ---------------- Server Integration (testcontainers + Postgres) ----------------
  # Build tag 'integration' ile yazılan testler. testcontainers-go gerçek Postgres
  # container'ı başlatır → migration up/down/up + seed validation. Docker GitHub
  # runner'da hazır (ubuntu-latest).
  server-integration:
    name: Server Integration (Postgres)
    runs-on: ubuntu-latest
    needs: [server]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: server/go.sum
      - name: Run integration tests
        run: go test -tags=integration -timeout=10m -v ./internal/db/...

  # ---------------- Docker Build & Push (GHCR) ----------------
  # Dockerfile uses --platform=$BUILDPLATFORM (native cross-compile, no QEMU).
  # Both main push and v* tag push build linux/amd64,linux/arm64 (~8dk total).
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [server]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine platforms
        id: platforms
        run: |
          echo "list=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT

      - name: Determine tags
        id: tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "api=ghcr.io/${{ github.repository_owner }}/envanter-api:${VERSION},ghcr.io/${{ github.repository_owner }}/envanter-api:latest" >> $GITHUB_OUTPUT
            echo "web=ghcr.io/${{ github.repository_owner }}/envanter-web:${VERSION},ghcr.io/${{ github.repository_owner }}/envanter-web:latest" >> $GITHUB_OUTPUT
          else
            SHA="${GITHUB_SHA::7}"
            echo "api=ghcr.io/${{ github.repository_owner }}/envanter-api:main-${SHA},ghcr.io/${{ github.repository_owner }}/envanter-api:latest" >> $GITHUB_OUTPUT
            echo "web=ghcr.io/${{ github.repository_owner }}/envanter-web:main-${SHA},ghcr.io/${{ github.repository_owner }}/envanter-web:latest" >> $GITHUB_OUTPUT
          fi

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          platforms: ${{ steps.platforms.outputs.list }}
          tags: ${{ steps.tags.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          platforms: ${{ steps.platforms.outputs.list }}
          tags: ${{ steps.tags.outputs.web }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # ---------------- Pre-commit (multi-language hygiene) ----------------
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v1.62.2/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v1.62.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure
