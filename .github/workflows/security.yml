name: Security Scan

# PR-PROD1: Automated security scanning on every push/PR to main.
# Jobs run in parallel where possible to keep the total wall time low.
#
# Blocking criteria (fail the check):
#   gosec    — HIGH or CRITICAL severity Go SAST findings
#   govulncheck — any known Go CVE
#   trivy    — HIGH or CRITICAL findings in container image / filesystem
#   npm audit — HIGH or CRITICAL npm vulnerabilities
#   gitleaks — any hardcoded secret detected in the diff

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly scan at 02:00 UTC (catches new CVEs on unchanged code)
    - cron: '0 2 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # upload SARIF results to GitHub Security tab

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # 1. Go SAST — gosec
  # ──────────────────────────────────────────────────────────────────────────
  gosec:
    name: Go SAST (gosec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif -severity high ./...'
          working-directory: server

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: server/gosec-results.sarif
          category: gosec

      # Hard-fail on HIGH+ (gosec exits 0 above due to -no-fail; re-run with fail)
      - name: Fail on HIGH+ findings
        working-directory: server
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -fmt text ./... || exit 1

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Go dependency CVE scan — govulncheck
  # ──────────────────────────────────────────────────────────────────────────
  govulncheck:
    name: Go Dependency CVEs (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Container + filesystem scan — Trivy
  # ──────────────────────────────────────────────────────────────────────────
  trivy:
    name: Container & FS Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ──────────────────────────────────────────────────────────────────────────
  # 4. npm audit — web UI
  # ──────────────────────────────────────────────────────────────────────────
  npm-audit:
    name: npm Audit (web UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # --audit-level=high: fail on high+ severity
        run: npm audit --audit-level=high --omit=dev

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Multi-language SAST — Semgrep
  # ──────────────────────────────────────────────────────────────────────────
  semgrep:
    name: Multi-language SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep-results.sarif \
            --error \
            --severity ERROR \
            .

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Hardcoded secret scan — Gitleaks
  # ──────────────────────────────────────────────────────────────────────────
  gitleaks:
    name: Hardcoded Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for accurate scan

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Kubernetes manifest security — Kubesec
  # ──────────────────────────────────────────────────────────────────────────
  kubesec:
    name: K8s Manifests (Kubesec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Scan K8s manifests with Kubesec
        run: |
          curl -sSL https://github.com/controlplaneio/kubesec/releases/download/v2.13.0/kubesec_linux_amd64.tar.gz \
            | tar xz kubesec
          chmod +x kubesec

          # Scan all YAML files in deploy/k8s/ — fail on score < 0
          FAILED=0
          for f in deploy/k8s/*.yaml; do
            echo "--- Scanning $f ---"
            SCORE=$(./kubesec scan "$f" | jq '.[0].score // 0')
            echo "Score: $SCORE"
            if [ "$SCORE" -lt 0 ]; then
              echo "FAIL: $f scored below 0"
              FAILED=1
            fi
          done
          exit $FAILED

  # ──────────────────────────────────────────────────────────────────────────
  # 8. CLI security — govulncheck for the CLI module
  # ──────────────────────────────────────────────────────────────────────────
  cli-govulncheck:
    name: CLI Dependency CVEs (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: cli/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
