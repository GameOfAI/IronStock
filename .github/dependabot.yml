# .github/dependabot.yml — PR-PROD1: Automated dependency updates.
#
# Dependabot opens PRs for outdated dependencies weekly.
# Merge policy (recommended): automerge patch+minor if CI passes.

version: 2

updates:
  # ── Go server module ────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Group all minor/patch Go updates into a single PR
      go-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ── Go CLI module ────────────────────────────────────────────────────────
  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
      - cli
    commit-message:
      prefix: "chore(deps/cli)"

  # ── npm (web UI) ─────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps/web)"
    groups:
      web-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ── npm (root / shared scripts) ─────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ───────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"

  # ── Docker (server image base) ───────────────────────────────────────────
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps/docker)"
